<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - StayFinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="font-['Roboto'] bg-gradient-to-br from-[#04aa6d]/10 to-[#038a5a]/20 min-h-screen">

    <!-- Main Content -->
    <main class="flex items-center justify-center min-h-screen py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Admin Login Card -->
            <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-200">
                
                <!-- Header -->
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-900 mb-2">Admin Login</h2>
                </div>

                <!-- Error Message -->
                <div id="admin-error" class="alert alert-error hidden mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="admin-error-message">Invalid admin credentials</span>
                </div>

                <!-- Admin Login Form -->
                <form id="admin-form" class="space-y-6">
                    <div>
                        <label for="admin-email" class="block text-sm font-semibold text-gray-700 mb-2">
                            Admin Email
                        </label>
                        <input id="admin-email" 
                               type="email" 
                               class="input input-bordered w-full" 
                               placeholder="admin@stayfinder.com" 
                               required
                               autocomplete="email">
                    </div>

                    <div>
                        <label for="admin-password" class="block text-sm font-semibold text-gray-700 mb-2">
                            Admin Password
                        </label>
                        <input id="admin-password" 
                               type="password" 
                               class="input input-bordered w-full" 
                               placeholder="Enter admin password" 
                               required
                               autocomplete="current-password">
                    </div>

                    <button type="submit" 
                            id="admin-submit-btn" 
                            class="btn bg-gradient-to-r from-[#04aa6d] to-[#038a5a] text-white w-full hover:from-[#038a5a] hover:to-[#026849] border-none text-lg py-3">
                        Access Admin Panel
                    </button>
                </form>

                <!-- Back to Homepage Button -->
                <div class="text-center mt-6">
                    <a href="index.html" 
                       class="btn btn-outline btn-sm text-[#04aa6d] border-[#04aa6d] hover:bg-[#04aa6d] hover:text-white">
                        ← Back to Homepage
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Handle admin form submission
        document.getElementById('admin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const submitBtn = document.getElementById('admin-submit-btn');
            const errorDiv = document.getElementById('admin-error');
            const errorMessage = document.getElementById('admin-error-message');

            // Hide previous errors
            errorDiv.classList.add('hidden');

            // Basic validation
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            // Check if email ends with @stayfinder.com (simple demo validation)
            if (!email.toLowerCase().endsWith('@stayfinder.com')) {
                showError('Admin email must end with @stayfinder.com');
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Accessing Admin Panel...';

            // Simulate admin login process
            setTimeout(() => {
                try {
                    // Create dummy admin user data
                    const adminUser = {
                        id: 'admin_' + Date.now(),
                        email: email,
                        fullName: 'Super Administrator',
                        role: 'Admin',
                        isAdmin: true,
                        createdAt: new Date().toISOString()
                    };

                    // Store admin data in localStorage
                    localStorage.setItem('user', JSON.stringify(adminUser));

                    // Redirect to superadmin.html
                    window.location.href = './superadmin.html';

                } catch (error) {
                    console.error('Admin login error:', error);
                    showError('An error occurred during login. Please try again.');
                } finally {
                    // Reset button state
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Access Admin Panel';
                }
            }, 1000); // 1 second delay to simulate authentication
        });

        function showError(message) {
            const errorDiv = document.getElementById('admin-error');
            const errorMessage = document.getElementById('admin-error-message');
            
            errorMessage.textContent = message;
            errorDiv.classList.remove('hidden');
        }
    </script>

</body>
</html>
